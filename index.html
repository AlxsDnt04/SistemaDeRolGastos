<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Ingresos y Egresos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/backgroundGradient.css">
    <!-- <link rel="stylesheet" href="css/buttonTraslucido.css"> -->
    <link rel="stylesheet" href="css/container.css">
    <link rel="stylesheet" href="css/fuentes.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Formulario de Ingresos y Egresos</h1>
        <form id="rolPagos" >
            <div class="row">
                <!-- Columna de Ingresos -->
                <div class="col-md-6">
                    <h3>Ingresos</h3>
                    <div class="mb-3">
                        <!-- cedula maximo 10 digitos -->
                        <!-- <label for="cedula" class="form-label">Cédula</label>
                        <input type="text" class="form-control" id="cedula" name="cedula" placeholder="Ingrese su cédula" maxlength="10">
                    </div>
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ingrese su nombre">
                    </div>
                    <div class="mb-3">
                        <label for="apellido" class="form-label">Apellido</label>
                        <input type="text" class="form-control" id="apellido" name="apellido" placeholder="Ingrese su apellido">
                    </div>
                    <div class="mb-3">
                        <label for="telefono" class="form-label">Teléfono</label>
                        <input type="text" class="form-control" id="telefono" name="telefono" placeholder="Ingrese su teléfono">
                    </div> -->
                    <div class="mb-3">
                        <label for="sueldo" class="form-label">Sueldo</label>
                        <input type="number" class="form-control" id="sueldo" name="sueldo" placeholder="Ingrese su sueldo">
                    </div>
                    <!-- HORA 25 -->
                    <div class="mb-3">
                        <label for="hora25" class="form-label">Hora 25</label>
                        <input type="number" class="form-control" id="hora25" name="hora25" placeholder="Ingrese el valor de la hora 25">
                        </div>
                    <div class="mb-3">
                        <label for="hora50" class="form-label">Hora 50</label>
                        <input type="number" class="form-control" id="hora50" name="hora50" placeholder="Ingrese el valor de la hora 50">
                        </div>
                    <div class="mb-3">
                        <label for="hora100" class="form-label">Hora 100</label>
                        <input type="number" class="form-control" id="hora100" name="hora100" placeholder="Ingrese el valor de la hora 100">
                </div>
                <!-- Columna de Egresos -->
                <div class="col-md-6">
                    <h3>Egresos</h3>
                    <div class="mb-3">
                        <label for="iess" class="form-label">IESS</label>
                        <input type="number" class="form-control" id="iess" name="iess" placeholder="Ingrese el valor del IESS">
                    </div>
                    <div class="mb-3">
                        <label for="multas" class="form-label">Multas</label>
                        <input type="number" class="form-control" id="multas" name="multas" placeholder="Ingrese el valor de multas">
                    </div>
                    <div class="mb-3">
                        <label for="atrasos" class="form-label">Atrasos</label>
                        <input type="number" class="form-control" id="atrasos" name="atrasos" placeholder="Ingrese el valor de atrasos">
                    </div>
                    <div class="mb-3">
                        <label for="alimentacion" class="form-label">Alimentación</label>
                        <input type="number" class="form-control" id="alimentacion" name="alimentacion" placeholder="Ingrese el valor de alimentación">
                    </div>
                    <div class="mb-3">
                        <label for="anticipo" class="form-label">Anticipo</label>
                        <input type="number" class="form-control" id="anticipo" name="anticipo" placeholder="Ingrese el valor de anticipo">
                    </div>
                    <div class="mb-3">
                        <label for="otros" class="form-label">Otros</label>
                        <input type="number" class="form-control" id="otros" name="otros" placeholder="Ingrese otros valores">
                    </div>
                </div>
            </div>

            <!-- inputs ocultos -->
            <input type="hidden" id="temp_total_25">
            <input type="hidden" id="temp_total_50">
            <input type="hidden" id="temp_total_100">
            <input type="hidden" id="temp_total_ingresos">

            <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary button-traslucido">Enviar</button>
                <button type="reset" class="btn btn-secondary button-traslucido">Limpiar</button>
            </div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html></div>
